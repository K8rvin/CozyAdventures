<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Лавка на перекрёстке миров</title>
<link rel="icon" type="image/svg+xml" href="assets/brand/fav2_mug.svg">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3d2f22">
<link rel="apple-touch-icon" href="assets/brand/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="topbar">
  <div class="topbar-context">
    <button id="topbar-back" class="ghost small topbar-back topbar-action" title="Назад" aria-label="Назад" hidden><svg class="topbar-back-art" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg><span class="topbar-back-label">Назад</span></button>
    <div class="brand" id="topbar-title">Лавка на перекрёстке миров</div>
  </div>
  <div class="wallet">
    <span id="wallet-coins" title="Монеты">🪙 0</span>
    <span id="wallet-seals" title="Печати мастера">🔰 0</span>
    <button id="achievements-btn" class="ghost small topbar-action topbar-icon-button" title="Достижения" aria-label="Достижения"><img class="topbar-achievement-art" src="assets/achievements/_book.webp" alt="" width="28" height="28"></button>
    <button id="settings-btn" class="ghost small topbar-action topbar-icon-button" title="Настройки" aria-label="Настройки"><svg class="topbar-settings-art" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15.4 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.16.37.37.7.6 1 .28.32.66.5 1.1.5H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51.5Z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </div>
</header>
<main id="screen"></main>
<div id="toast"></div>
<div id="rotate-hint" hidden>
  <div class="rh-card">
    <div class="rh-icon">🔄📱</div>
    <div class="rh-title">Поверни устройство</div>
    <div class="rh-text">Лавке удобнее в горизонтальном положении.</div>
    <div class="rh-actions">
      <button id="rh-fullscreen" class="primary">📺 Во весь экран (горизонталь)</button>
      <button id="rh-dismiss" class="ghost small">Продолжить так</button>
    </div>
  </div>
</div>
<script src="knight-api.js"></script>
<script src="bundle.js"></script>
<script>
(function () {
  var hint = document.getElementById('rotate-hint');
  var mq = window.matchMedia('(orientation: portrait)');
  var coarse = window.matchMedia('(pointer: coarse)');
  var dismissed = false;
  function update() {
    hint.hidden = dismissed || !coarse.matches || !mq.matches;
  }
  mq.addEventListener?.('change', update);
  update();
  document.getElementById('rh-dismiss').addEventListener('click', function () {
    dismissed = true;
    update();
  });
  document.getElementById('rh-fullscreen').addEventListener('click', function () {
    var el = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen;
    var p = req ? req.call(el) : Promise.reject();
    Promise.resolve(p).then(function () {
      return screen.orientation?.lock?.('landscape').catch(function () {});
    }).catch(function () {});
    dismissed = true;
    update();
  });
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>

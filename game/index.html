<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Лавка на перекрёстке миров</title>
<link rel="icon" type="image/svg+xml" href="assets/fav2_mug.svg">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3d2f22">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="topbar">
  <div class="brand">🏮 Лавка на перекрёстке миров</div>
  <div class="wallet">
    <span id="wallet-coins" title="Монеты">🪙 0</span>
    <span id="wallet-seals" title="Печати мастера">🔰 0</span>
    <button id="achievements-btn" class="ghost small" title="Достижения" style="min-height:0;padding:4px 10px">🏆</button>
    <button id="settings-btn" class="ghost small" title="Настройки" style="min-height:0;padding:4px 10px">⚙️</button>
  </div>
</header>
<main id="screen"></main>
<div id="toast"></div>
<div id="rotate-hint" hidden>
  <div class="rh-card">
    <div class="rh-icon">🔄📱</div>
    <div class="rh-title">Поверни устройство</div>
    <div class="rh-text">Лавке удобнее в горизонтальном положении.</div>
    <div class="rh-actions">
      <button id="rh-fullscreen" class="primary">📺 Во весь экран (горизонталь)</button>
      <button id="rh-dismiss" class="ghost small">Продолжить так</button>
    </div>
  </div>
</div>
<script src="bundle.js"></script>
<script>
(function () {
  var hint = document.getElementById('rotate-hint');
  var mq = window.matchMedia('(orientation: portrait)');
  var coarse = window.matchMedia('(pointer: coarse)');
  var dismissed = false;
  function update() {
    hint.hidden = dismissed || !coarse.matches || !mq.matches;
  }
  mq.addEventListener?.('change', update);
  update();
  document.getElementById('rh-dismiss').addEventListener('click', function () {
    dismissed = true;
    update();
  });
  document.getElementById('rh-fullscreen').addEventListener('click', function () {
    var el = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen;
    var p = req ? req.call(el) : Promise.reject();
    Promise.resolve(p).then(function () {
      return screen.orientation?.lock?.('landscape').catch(function () {});
    }).catch(function () {});
    dismissed = true;
    update();
  });
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
<defs>
<radialGradient id="paperGrad" cx="50%" cy="48%" r="75%">
<stop offset="0%" stop-color="#FFF7E6"/>
<stop offset="58%" stop-color="#F3E8CC"/>
<stop offset="100%" stop-color="#E6D5B0"/>
</radialGradient>
<radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#FFD99A" stop-opacity="0.55"/>
<stop offset="100%" stop-color="#FFD99A" stop-opacity="0"/>
</radialGradient>
<linearGradient id="helmetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#E8EEE3"/>
<stop offset="55%" stop-color="#C2CEB8"/>
<stop offset="100%" stop-color="#9AAE95"/>
</linearGradient>
<linearGradient id="leafGrad" x1="30%" y1="10%" x2="80%" y2="90%">
<stop offset="0%" stop-color="#FFC66B"/>
<stop offset="50%" stop-color="#E68A2E"/>
<stop offset="100%" stop-color="#B65E1A"/>
</linearGradient>
<linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#FFE8CC"/>
<stop offset="100%" stop-color="#EFC9A0"/>
</linearGradient>
<filter id="watercolor" x="-20%" y="-20%" width="140%" height="140%">
<feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="5" result="noise"/>
<feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
<feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#5C4A33" flood-opacity="0.18"/>
</filter>
</defs>
<!-- Background paper -->
<rect width="128" height="128" rx="26" fill="url(#paperGrad)"/>
<!-- subtle paper grain -->
<rect width="128" height="128" rx="26" fill="#D8C9A8" opacity="0.08" style="filter:url(#watercolor)"/>
<!-- portrait backing circle -->
<circle cx="64" cy="64" r="48.5" fill="#F5EAD0" stroke="#D8C4A3" stroke-width="1.4" opacity="1"/>
<circle cx="64" cy="64" r="46" fill="none" stroke="#EADDC0" stroke-width="1" opacity="0.9"/>
<!-- warm candlelit glow behind knight -->
<circle cx="64" cy="63" r="38" fill="url(#glowGrad)" opacity="0.9"/>
<!-- shoulders / cape -->
<g filter="url(#softShadow)">
<ellipse cx="64" cy="101.5" rx="33" ry="18" fill="#7E8F7D" stroke="#4A3F32" stroke-width="1.7" stroke-linejoin="round"/>
<!-- cape collar amber -->
<path d="M 38.5 88 Q 44 96 64 99 Q 84 96 89.5 88 L 82 82 Q 64 88 46 82 Z" fill="#D99A3A" stroke="#4A3F32" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M 46 82 Q 64 88 82 82" stroke="#FFF1C7" stroke-width="1" stroke-linecap="round" opacity="0.6" fill="none"/>
<!-- neck -->
<rect x="56" y="84" width="16" height="10" rx="3" fill="#EFC9A0" stroke="#4A3F32" stroke-width="1.3"/>
<!-- helmet outer dome -->
<ellipse cx="64" cy="61.5" rx="31.5" ry="29" fill="url(#helmetGrad)" stroke="#4A3F32" stroke-width="1.8" stroke-linejoin="round"/>
<!-- helmet side shading watercolor -->
<ellipse cx="64" cy="61.5" rx="31.5" ry="29" fill="#8FA48E" opacity="0.18"/>
<path d="M 38 62 Q 42 38 64 33 Q 86 38 90 62 Q 86 58 64 56 Q 42 58 38 62 Z" fill="#FFFFFF" opacity="0.22"/>
<!-- helmet rim / brow -->
<path d="M 34.5 67.5 Q 64 76 93.5 67.5 L 91 73 Q 64 82.5 37 73 Z" fill="#B9C7B3" stroke="#4A3F32" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M 37 73 Q 64 82.5 91 73" stroke="#FFFFFF" stroke-width="1" opacity="0.35" fill="none" stroke-linecap="round"/>
<!-- cheek guards -->
<path d="M 36 68 Q 32 74 36.5 81 Q 41 78 42 68 Z" fill="#A8B9A4" stroke="#4A3F32" stroke-width="1.3" stroke-linejoin="round"/>
<path d="M 92 68 Q 96 74 91.5 81 Q 87 78 86 68 Z" fill="#A8B9A4" stroke="#4A3F32" stroke-width="1.3" stroke-linejoin="round"/>
<!-- rivets -->
<circle cx="45" cy="60" r="1.3" fill="#4A3F32" opacity="0.8"/>
<circle cx="83" cy="60" r="1.3" fill="#4A3F32" opacity="0.8"/>
<circle cx="42.5" cy="70.5" r="1.3" fill="#4A3F32" opacity="0.8"/>
<circle cx="85.5" cy="70.5" r="1.3" fill="#4A3F32" opacity="0.8"/>
<!-- face opening -->
<ellipse cx="64" cy="71.5" rx="21.5" ry="19.5" fill="url(#faceGrad)" stroke="#4A3F32" stroke-width="1.6"/>
<!-- inner shadow -->
<ellipse cx="64" cy="71.5" rx="21.5" ry="19.5" fill="none" stroke="#C49A7A" stroke-width="1" opacity="0.25"/>
<!-- blush -->
<ellipse cx="50.5" cy="77.5" rx="5.5" ry="3.2" fill="#E98A7A" opacity="0.28"/>
<ellipse cx="77.5" cy="77.5" rx="5.5" ry="3.2" fill="#E98A7A" opacity="0.28"/>
<!-- eyes large friendly -->
<g stroke="#3E352E" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
<ellipse cx="55.5" cy="71" rx="5.2" ry="6" fill="#3E352E"/>
<ellipse cx="72.5" cy="71" rx="5.2" ry="6" fill="#3E352E"/>
</g>
<!-- eye highlights candlelit -->
<circle cx="57.2" cy="69.2" r="1.9" fill="white" opacity="0.95"/>
<circle cx="56" cy="72" r="0.7" fill="white" opacity="0.7"/>
<circle cx="74.2" cy="69.2" r="1.9" fill="white" opacity="0.95"/>
<circle cx="73" cy="72" r="0.7" fill="white" opacity="0.7"/>
<!-- amber catchlight -->
<circle cx="54.2" cy="69.8" r="0.9" fill="#FFD07A" opacity="0.9"/>
<circle cx="71.2" cy="69.8" r="0.9" fill="#FFD07A" opacity="0.9"/>
<!-- small nose -->
<ellipse cx="64" cy="76.2" rx="1.1" ry="0.9" fill="#C98A6A" opacity="0.9"/>
<!-- smile -->
<path d="M 60.5 80.2 Q 64 82.5 67.5 80.2" stroke="#4A3F32" stroke-width="1.3" stroke-linecap="round" fill="none"/>
<path d="M 60 80 Q 64 81 68 80" stroke="#8A5A3A" stroke-width="0.7" opacity="0.4" fill="none" stroke-linecap="round"/>
<!-- helmet top leaf plume holder -->
<ellipse cx="64" cy="34.5" rx="6.5" ry="3.2" fill="#8A9A8E" stroke="#4A3F32" stroke-width="1.3"/>
<!-- leaf plume -->
<g stroke="#4A3F32" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
<path d="M 64 13.5 C 66.5 16.5 73 19.5 71.5 26.5 C 70 32 66 35.5 64 37 C 62 35.5 58 32 56.5 26.5 C 55 19.5 61.5 16.5 64 13.5 Z" fill="url(#leafGrad)"/>
<path d="M 64 15.5 L 64 35" stroke="#4A3F32" stroke-width="1" opacity="0.95" fill="none"/>
<path d="M 64 23 Q 68 25 69.5 27" stroke="#4A3F32" stroke-width="0.8" opacity="0.9" fill="none"/>
<path d="M 64 23 Q 60 25 58.5 27" stroke="#4A3F32" stroke-width="0.8" opacity="0.9" fill="none"/>
<path d="M 64 28 Q 67 29.5 68.5 31.5" stroke="#4A3F32" stroke-width="0.7" opacity="0.85" fill="none"/>
<path d="M 64 28 Q 61 29.5 59.5 31.5" stroke="#4A3F32" stroke-width="0.7" opacity="0.85" fill="none"/>
</g>
<!-- highlight on leaf -->
<path d="M 64 16 Q 66 19 68 23 Q 65 21 64 18 Z" fill="white" opacity="0.38"/>
<!-- tiny berries / amber accents on helmet sides -->
<circle cx="64" cy="48.5" r="2" fill="#D98E2E" stroke="#4A3F32" stroke-width="1"/>
<circle cx="64" cy="48.5" r="0.7" fill="white" opacity="0.7"/>
</g>
<!-- watercolor paper texture overlay soft -->
<rect x="0" y="0" width="128" height="128" rx="26" fill="white" opacity="0.04" style="filter:url(#watercolor)"/>
<!-- vignette ink border -->
<rect x="0.7" y="0.7" width="126.6" height="126.6" rx="25.3" fill="none" stroke="#4A3F32" stroke-width="0.9" opacity="0.18"/>
</svg>
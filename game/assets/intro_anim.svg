<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img">
<defs>
  <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1b2433"/>
    <stop offset="38%" stop-color="#2e3a52"/>
    <stop offset="68%" stop-color="#5a4a5a"/>
    <stop offset="100%" stop-color="#8a6a4a"/>
  </linearGradient>
  <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#f3e6cf"/>
    <stop offset="100%" stop-color="#e8d9b8"/>
  </linearGradient>
  <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ffca7a" stop-opacity="0.85"/>
    <stop offset="45%" stop-color="#ffca7a" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#ffca7a" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ffca7a" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#ffca7a" stop-opacity="0"/>
  </radialGradient>
  <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3.5"/>
  </filter>
  <filter id="glowBlur" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
</defs>

<!-- Sky -->
<rect x="0" y="0" width="800" height="400" fill="url(#skyGrad)"/>

<!-- Distant hills -->
<path d="M0 285 Q 140 220 280 265 T 560 260 T 800 285 L 800 400 L 0 400 Z" fill="#2a3520" opacity="0.9"/>
<path d="M0 295 Q 180 250 360 285 T 700 275 T 800 300 L 800 400 L 0 400 Z" fill="#5d6b3f" opacity="1"/>

<!-- Soft clouds at dusk -->
<g opacity="0.35" fill="#f3e6cf">
  <g>
    <ellipse cx="120" cy="75" rx="55" ry="18"/>
    <ellipse cx="145" cy="68" rx="38" ry="14"/>
    <ellipse cx="95" cy="70" rx="32" ry="12"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; 12 0; 0 0" dur="28s" repeatCount="indefinite" additive="sum"/>
  </g>
  <g>
    <ellipse cx="640" cy="62" rx="62" ry="16"/>
    <ellipse cx="670" cy="55" rx="40" ry="12"/>
    <ellipse cx="610" cy="58" rx="28" ry="10"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; -15 0; 0 0" dur="32s" repeatCount="indefinite" additive="sum"/>
  </g>
</g>

<!-- Stars fading in -->
<g id="stars" fill="#f3e6cf">
  <circle cx="72" cy="42" r="1.6"><animate attributeName="opacity" values="0;0;1;1;0" dur="4s" repeatCount="indefinite" begin="0s"/></circle>
  <circle cx="135" cy="28" r="1.2"><animate attributeName="opacity" values="0;1;0.2;1;0" dur="5.2s" repeatCount="indefinite" begin="0.7s"/></circle>
  <circle cx="190" cy="55" r="1.4"><animate attributeName="opacity" values="0;0.9;0;1;0" dur="4.6s" repeatCount="indefinite" begin="1.2s"/></circle>
  <circle cx="240" cy="32" r="1"><animate attributeName="opacity" values="0;1;0.6;0.2;0" dur="6s" repeatCount="indefinite" begin="0.3s"/></circle>
  <circle cx="580" cy="38" r="1.5"><animate attributeName="opacity" values="0;0;1;0.8;0" dur="5s" repeatCount="indefinite" begin="1.8s"/></circle>
  <circle cx="620" cy="22" r="1.1"><animate attributeName="opacity" values="0;1;0.3;1;0" dur="4.3s" repeatCount="indefinite" begin="0.9s"/></circle>
  <circle cx="700" cy="48" r="1.7"><animate attributeName="opacity" values="0;0.8;0;0.9;0" dur="5.8s" repeatCount="indefinite" begin="2.1s"/></circle>
  <circle cx="750" cy="30" r="1.2"><animate attributeName="opacity" values="0;1;0.4;1;0" dur="4.8s" repeatCount="indefinite" begin="1.5s"/></circle>
  <circle cx="45" cy="88" r="1"><animate attributeName="opacity" values="0;0.7;0;1;0" dur="6.5s" repeatCount="indefinite" begin="2.4s"/></circle>
  <circle cx="680" cy="85" r="1"><animate attributeName="opacity" values="0;1;0.5;0;0" dur="5.5s" repeatCount="indefinite" begin="0.2s"/></circle>
  <circle cx="520" cy="28" r="1.3"><animate attributeName="opacity" values="0;0;1;0.6;0" dur="4s" repeatCount="indefinite" begin="1s"/></circle>
  <circle cx="310" cy="48" r="1"><animate attributeName="opacity" values="0;1;0;0.9;0" dur="7s" repeatCount="indefinite" begin="0.5s"/></circle>
</g>

<!-- Building facade -->
<g id="building">
  <!-- Main wall -->
  <rect x="268" y="88" width="264" height="212" rx="8" fill="url(#wallGrad)" stroke="#3d2f22" stroke-width="6"/>
  <!-- Timber beams -->
  <rect x="268" y="158" width="264" height="14" rx="4" fill="#3d2f22"/>
  <rect x="268" y="232" width="264" height="14" rx="4" fill="#3d2f22"/>
  <rect x="330" y="88" width="14" height="212" rx="4" fill="#3d2f22"/>
  <rect x="456" y="88" width="14" height="212" rx="4" fill="#3d2f22"/>
  <!-- Roof -->
  <path d="M 250 92 L 400 28 L 550 92 L 532 104 L 400 48 L 268 104 Z" fill="#3d2f22"/>
  <path d="M 268 104 L 400 48 L 532 104 L 532 118 L 400 62 L 268 118 Z" fill="#2a1f14"/>
  <!-- Moss on roof -->
  <ellipse cx="400" cy="42" rx="42" ry="10" fill="#5d6b3f" opacity="0.95"/>
  <ellipse cx="365" cy="52" rx="18" ry="6" fill="#5d6b3f" opacity="0.85"/>
  <ellipse cx="435" cy="52" rx="20" ry="7" fill="#5d6b3f" opacity="0.85"/>
  <!-- Windows -->
  <rect x="286" y="178" width="52" height="44" rx="6" fill="#3d2f22"/>
  <rect x="290" y="182" width="44" height="36" rx="4" fill="#ffca7a" opacity="0.95">
    <animate attributeName="opacity" values="0.92;1;0.92" dur="2.8s" repeatCount="indefinite"/>
  </rect>
  <line x1="312" y1="182" x2="312" y2="218" stroke="#3d2f22" stroke-width="3" opacity="0.9"/>
  <line x1="290" y1="200" x2="334" y2="200" stroke="#3d2f22" stroke-width="3" opacity="0.9"/>
  <rect x="462" y="178" width="52" height="44" rx="6" fill="#3d2f22"/>
  <rect x="466" y="182" width="44" height="36" rx="4" fill="#ffca7a" opacity="0.95">
    <animate attributeName="opacity" values="1;0.92;1" dur="3.1s" repeatCount="indefinite"/>
  </rect>
  <line x1="488" y1="182" x2="488" y2="218" stroke="#3d2f22" stroke-width="3" opacity="0.9"/>
  <line x1="466" y1="200" x2="510" y2="200" stroke="#3d2f22" stroke-width="3" opacity="0.9"/>
  <!-- Window glows -->
  <ellipse cx="312" cy="205" rx="38" ry="22" fill="url(#glowGrad)" opacity="0.38">
    <animate attributeName="opacity" values="0.32;0.48;0.32" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="488" cy="205" rx="38" ry="22" fill="url(#glowGrad)" opacity="0.38">
    <animate attributeName="opacity" values="0.48;0.32;0.48" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <!-- Door -->
  <rect x="365" y="246" width="70" height="54" rx="6" fill="#3d2f22"/>
  <rect x="371" y="252" width="58" height="48" rx="4" fill="#4a3720" stroke="#2a1f14" stroke-width="2"/>
  <rect x="378" y="260" width="16" height="28" rx="2" fill="#ffca7a" opacity="0.35"/>
  <rect x="406" y="260" width="16" height="28" rx="2" fill="#ffca7a" opacity="0.35"/>
  <circle cx="395" cy="283" r="3.5" fill="#ffca7a" opacity="0.9"/>
  <!-- Door light spill -->
  <ellipse cx="400" cy="303" rx="55" ry="14" fill="#ffca7a" opacity="0.18" filter="url(#softBlur)"/>
  <!-- Ivy -->
  <g fill="#5d6b3f" opacity="0.95">
    <ellipse cx="268" cy="125" rx="14" ry="18"/>
    <ellipse cx="272" cy="145" rx="10" ry="12"/>
    <ellipse cx="532" cy="135" rx="16" ry="20"/>
    <ellipse cx="528" cy="162" rx="11" ry="13"/>
    <ellipse cx="275" cy="265" rx="12" ry="14"/>
    <ellipse cx="525" cy="255" rx="13" ry="16"/>
  </g>
  <!-- Ground shadow -->
  <ellipse cx="400" cy="312" rx="110" ry="10" fill="#1e140a" opacity="0.25"/>
</g>

<!-- Iron bracket -->
<g id="bracket" fill="#2a1f14" stroke="#1a140e" stroke-width="2">
  <rect x="398" y="102" width="78" height="10" rx="5"/>
  <rect x="398" y="110" width="10" height="22" rx="3"/>
  <path d="M 468 112 Q 478 112 478 122 Q 478 132 468 132 L 466 132 Q 472 132 472 122 Q 472 112 466 112 Z" fill="#1a140e" stroke="none"/>
  <circle cx="472" cy="122" r="6" fill="#1a140e"/>
  <circle cx="472" cy="122" r="2.5" fill="#3d2f22"/>
</g>

<!-- Swaying sign assembly -->
<g id="signAssembly">
  <!-- Chains -->
  <line x1="472" y1="122" x2="445" y2="148" stroke="#1a140e" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="472" y1="122" x2="355" y2="148" stroke="#1a140e" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="472" y1="122" x2="400" y2="145" stroke="#1a140e" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <!-- Small chain links decoration -->
  <circle cx="460" cy="133" r="2" fill="none" stroke="#1a140e" stroke-width="1.5"/>
  <circle cx="380" cy="133" r="2" fill="none" stroke="#1a140e" stroke-width="1.5"/>
  
  <!-- Sign that sways -->
  <g id="swayingSign">
    <animateTransform attributeName="transform" type="rotate" values="-2.8 472 122; 2.8 472 122; -2.8 472 122" dur="3.8s" repeatCount="indefinite" additive="sum" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1" />
    <!-- Sign board shadow -->
    <ellipse cx="400" cy="222" rx="52" ry="8" fill="#1e140a" opacity="0.22" filter="url(#softBlur)"/>
    <!-- Main board -->
    <rect x="322" y="142" width="156" height="92" rx="14" fill="#3d2f22" stroke="#2a1f14" stroke-width="4"/>
    <rect x="330" y="150" width="140" height="76" rx="10" fill="none" stroke="#ffca7a" stroke-width="1.8" opacity="0.35"/>
    <!-- Wood grain lines -->
    <path d="M 332 165 Q 400 168 468 165" stroke="#4a3720" stroke-width="1.2" opacity="0.5" fill="none" stroke-linecap="round"/>
    <path d="M 332 185 Q 400 188 468 185" stroke="#4a3720" stroke-width="1" opacity="0.4" fill="none" stroke-linecap="round"/>
    <path d="M 332 205 Q 400 202 468 205" stroke="#4a3720" stroke-width="1.2" opacity="0.45" fill="none" stroke-linecap="round"/>
    <!-- Decorative rivets -->
    <circle cx="336" cy="156" r="3" fill="#2a1f14" stroke="#ffca7a" stroke-width="1" opacity="0.6"/>
    <circle cx="464" cy="156" r="3" fill="#2a1f14" stroke="#ffca7a" stroke-width="1" opacity="0.6"/>
    <circle cx="336" cy="220" r="3" fill="#2a1f14" stroke="#ffca7a" stroke-width="1" opacity="0.6"/>
    <circle cx="464" cy="220" r="3" fill="#2a1f14" stroke="#ffca7a" stroke-width="1" opacity="0.6"/>
    <!-- Emblem: stylized lantern/moon + leaves -->
    <g id="emblem">
      <!-- Outer circle -->
      <circle cx="400" cy="186" r="28" fill="#f3e6cf" opacity="0.95"/>
      <circle cx="400" cy="186" r="24" fill="none" stroke="#3d2f22" stroke-width="1.5" opacity="0.15"/>
      <!-- Leaves -->
      <path d="M 400 168 Q 385 175 383 186 Q 385 197 400 204 Q 415 197 417 186 Q 415 175 400 168 Z" fill="#5d6b3f" opacity="1"/>
      <path d="M 400 172 Q 392 180 392 186 Q 392 192 400 200 Q 408 192 408 186 Q 408 180 400 172 Z" fill="#7a8a4f" opacity="1"/>
      <!-- Small amber lantern icon inside -->
      <g>
        <rect x="393" y="182" width="14" height="14" rx="2.5" fill="#3d2f22"/>
        <rect x="395" y="184" width="10" height="8" rx="1" fill="#ffca7a">
          <animate attributeName="opacity" values="0.9;1;0.85;1;0.9" dur="0.9s" repeatCount="indefinite"/>
        </rect>
        <rect x="392" y="180.5" width="16" height="3" rx="1" fill="#2a1f14"/>
        <rect x="392" y="195.5" width="16" height="2" rx="1" fill="#2a1f14"/>
      </g>
      <!-- Tiny stars around emblem -->
      <circle cx="382" cy="170" r="1.2" fill="#ffca7a" opacity="0.9"/>
      <circle cx="418" cy="172" r="1" fill="#ffca7a" opacity="0.9"/>
      <circle cx="420" cy="200" r="1.1" fill="#ffca7a" opacity="0.9"/>
      <circle cx="380" cy="202" r="0.9" fill="#ffca7a" opacity="0.9"/>
    </g>
    <!-- Hanging lantern below sign -->
    <g id="hangingLantern">
      <line x1="400" y1="234" x2="400" y2="244" stroke="#1a140e" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Glow behind lantern -->
      <ellipse cx="400" cy="268" rx="46" ry="32" fill="url(#lanternGlow)" opacity="0.55">
        <animate attributeName="opacity" values="0.45;0.65;0.5;0.6;0.45" dur="2.2s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="400" cy="272" rx="72" ry="18" fill="#ffca7a" opacity="0.12" filter="url(#glowBlur)">
        <animate attributeName="opacity" values="0.08;0.16;0.1;0.14;0.08" dur="2.2s" repeatCount="indefinite"/>
      </ellipse>
      <!-- Lantern body -->
      <g>
        <path d="M 385 244 L 415 244 L 418 250 L 418 272 L 382 272 L 382 250 Z" fill="#2a1f14" stroke="#1a140e" stroke-width="1.5"/>
        <rect x="386" y="252" width="28" height="18" rx="2" fill="#ffca7a" stroke="#ffb86a" stroke-width="1">
          <animate attributeName="opacity" values="0.88;1;0.92;1;0.88" dur="1.4s" repeatCount="indefinite"/>
        </rect>
        <!-- Vertical bars -->
        <line x1="394" y1="252" x2="394" y2="270" stroke="#2a1f14" stroke-width="1.2" opacity="0.9"/>
        <line x1="400" y1="252" x2="400" y2="270" stroke="#2a1f14" stroke-width="1.2" opacity="0.9"/>
        <line x1="406" y1="252" x2="406" y2="270" stroke="#2a1f14" stroke-width="1.2" opacity="0.9"/>
        <!-- Top and bottom caps -->
        <rect x="384" y="244" width="32" height="6" rx="2" fill="#3d2f22" stroke="#1a140e" stroke-width="1"/>
        <rect x="384" y="270" width="32" height="5" rx="1.5" fill="#3d2f22" stroke="#1a140e" stroke-width="1"/>
        <!-- Highlight -->
        <ellipse cx="396" cy="258" rx="5" ry="6" fill="white" opacity="0.18"/>
      </g>
      <!-- Light reflection on sign bottom -->
      <ellipse cx="400" cy="232" rx="28" ry="5" fill="#ffca7a" opacity="0.25">
        <animate attributeName="opacity" values="0.18;0.3;0.22;0.28;0.18" dur="1.6s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </g>
</g>

<!-- Fireflies blinking -->
<g id="fireflies">
  <g>
    <circle cx="0" cy="0" r="3.2" fill="#ffca7a" filter="url(#softBlur)" opacity="0.9"/>
    <circle cx="0" cy="0" r="1.6" fill="#fff4d6"/>
    <animateTransform attributeName="transform" type="translate" values="145 245; 155 225; 138 210; 145 245" dur="7s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <animate attributeName="opacity" values="0;1;0;0.9;0" dur="2.1s" repeatCount="indefinite" begin="0s"/>
  </g>
  <g>
    <circle cx="0" cy="0" r="2.8" fill="#ffca7a" filter="url(#softBlur)" opacity="0.9"/>
    <circle cx="0" cy="0" r="1.4" fill="#fff4d6"/>
    <animateTransform attributeName="transform" type="translate" values="620 260; 605 240; 630 220; 620 260" dur="6.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <animate attributeName="opacity" values="0;0;1;0;0.8;0" dur="2.6s" repeatCount="indefinite" begin="0.8s"/>
  </g>
  <g>
    <circle cx="0" cy="0" r="3" fill="#ffca7a" filter="url(#softBlur)" opacity="0.9"/>
    <circle cx="0" cy="0" r="1.5" fill="#fff4d6"/>
    <animateTransform attributeName="transform" type="translate" values="210 285; 225 270; 200 255; 210 285" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <animate attributeName="opacity" values="0;1;0.2;0;1;0" dur="1.9s" repeatCount="indefinite" begin="1.3s"/>
  </g>
  <g>
    <circle cx="0" cy="0" r="2.6" fill="#ffca7a" filter="url(#softBlur)" opacity="0.9"/>
    <circle cx="0" cy="0" r="1.3" fill="#fff4d6"/>
    <animateTransform attributeName="transform" type="translate" values="560 285; 545 265; 570 250; 560 285" dur="7.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <animate attributeName="opacity" values="0;0.9;0;1;0" dur="2.4s" repeatCount="indefinite" begin="0.4s"/>
  </g>
  <g>
    <circle cx="0" cy="0" r="2.9" fill="#ffca7a" filter="url(#softBlur)" opacity="0.9"/>
    <circle cx="0" cy="0" r="1.4" fill="#fff4d6"/>
    <animateTransform attributeName="transform" type="translate" values="85 280; 95 260; 75 245; 85 280" dur="6.8s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <animate attributeName="opacity" values="0;1;0;0.7;0" dur="2.9s" repeatCount="indefinite" begin="1.7s"/>
  </g>
  <g>
    <circle cx="0" cy="0" r="2.4" fill="#ffca7a" filter="url(#softBlur)" opacity="0.9"/>
    <circle cx="0" cy="0" r="1.2" fill="#fff4d6"/>
    <animateTransform attributeName="transform" type="translate" values="710 275; 695 255; 720 235; 710 275" dur="9s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <animate attributeName="opacity" values="0;0;1;0;0.9;0" dur="3.2s" repeatCount="indefinite" begin="0.6s"/>
  </g>
</g>

<!-- Foreground grass tufts -->
<g fill="#5d6b3f" opacity="1">
  <path d="M 0 342 Q 20 325 40 342 Q 55 320 75 342 L 0 342 Z"/>
  <path d="M 60 348 Q 80 330 100 348 Q 115 325 135 348 L 60 348 Z"/>
  <path d="M 680 345 Q 700 325 720 345 Q 735 320 755 345 L 680 345 Z"/>
  <path d="M 730 350 Q 750 332 770 350 Q 785 328 800 350 L 730 350 Z"/>
  <path d="M 320 338 Q 340 322 360 338 Q 375 315 395 338 L 320 338 Z"/>
  <path d="M 440 340 Q 460 324 480 340 Q 495 318 515 340 L 440 340 Z"/>
</g>
<!-- Subtle vignette -->
<rect x="0" y="0" width="800" height="400" fill="none" stroke="#1a140e" stroke-width="14" opacity="0.12" rx="18"/>
</svg>
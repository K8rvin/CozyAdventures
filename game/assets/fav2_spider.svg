<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img">
<defs>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="b"/>
    <feColorMatrix in="b" type="matrix" values="1 0 0 0 0.95 0 1 0 0 0.75 0 0 1 0 0.35 0 0 0 0.55 0" result="c"/>
    <feMerge>
      <feMergeNode in="c"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <linearGradient id="hatGold" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#FFE9A8"/>
    <stop offset="45%" stop-color="#F5C542"/>
    <stop offset="100%" stop-color="#E8A838"/>
  </linearGradient>
  <radialGradient id="belly" cx="35%" cy="30%" r="75%">
    <stop offset="0%" stop-color="#FFFDF0"/>
    <stop offset="55%" stop-color="#FFF4D0"/>
    <stop offset="100%" stop-color="#FFDE8A"/>
  </radialGradient>
  <radialGradient id="headGrad" cx="35%" cy="30%" r="80%">
    <stop offset="0%" stop-color="#FFD99A"/>
    <stop offset="100%" stop-color="#F5A84A"/>
  </radialGradient>
</defs>
<!-- thread -->
<line x1="32" y1="0" x2="32" y2="15.5" stroke="#DDB56A" stroke-width="1.6" stroke-linecap="round" opacity="0.95"/>
<!-- legs - thick rounded, moss green with warm outline -->
<g fill="none" stroke="#6B7F3A" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
  <!-- left -->
  <path d="M27.2 27.2 C 20.5 24.2, 14.2 20.5, 11.2 13.8"/>
  <path d="M26 30.2 C 18.2 30, 11.5 28.2, 7.8 22.2"/>
  <path d="M26 33.5 C 17.8 36.2, 10.8 38.5, 7.5 33.8"/>
  <path d="M27.2 36.2 C 20.8 40.2, 14.5 44.2, 11 41.2"/>
  <!-- right -->
  <path d="M36.8 27.2 C 43.5 24.2, 49.8 20.5, 52.8 13.8"/>
  <path d="M38 30.2 C 45.8 30, 52.5 28.2, 56.2 22.2"/>
  <path d="M38 33.5 C 46.2 36.2, 53.2 38.5, 56.5 33.8"/>
  <path d="M36.8 36.2 C 43.2 40.2, 49.5 44.2, 53 41.2"/>
</g>
<!-- leg inner highlight -->
<g fill="none" stroke="#9AB85A" stroke-width="0.9" stroke-linecap="round" opacity="0.45">
  <path d="M27.2 27.2 C 20.5 24.2, 14.2 20.5, 11.2 13.8"/>
  <path d="M26 30.2 C 18.2 30, 11.5 28.2, 7.8 22.2"/>
  <path d="M36.8 27.2 C 43.5 24.2, 49.8 20.5, 52.8 13.8"/>
  <path d="M38 30.2 C 45.8 30, 52.5 28.2, 56.2 22.2"/>
</g>
<!-- body group with soft glow -->
<g filter="url(#glow)">
  <!-- abdomen - big round cream -->
  <ellipse cx="32" cy="43.5" rx="12.2" ry="11.2" fill="url(#belly)" stroke="#E8B84A" stroke-width="1.9"/>
  <!-- belly pattern - moss green spots -->
  <ellipse cx="32" cy="45.8" rx="5.2" ry="3.8" fill="#DDE8B8" opacity="0.0"/>
  <!-- cute belly mark -->
  <g fill="#7A9A3E" opacity="0.95">
    <ellipse cx="32" cy="46.2" rx="2.1" ry="2.6"/>
    <ellipse cx="28.6" cy="43.2" rx="1.45" ry="1.45"/>
    <ellipse cx="35.4" cy="43.2" rx="1.45" ry="1.45"/>
  </g>
  <g fill="#FFFDF0" opacity="0.9">
    <ellipse cx="32" cy="46.0" rx="0.9" ry="1.1"/>
    <circle cx="28.6" cy="43.2" r="0.55"/>
    <circle cx="35.4" cy="43.2" r="0.55"/>
  </g>
  <!-- highlight on abdomen -->
  <ellipse cx="28.2" cy="39.5" rx="3.2" ry="2.2" fill="white" opacity="0.42"/>
  <!-- head -->
  <circle cx="32" cy="29.2" r="7.6" fill="url(#headGrad)" stroke="#E8A838" stroke-width="1.6"/>
  <!-- cheeks -->
  <ellipse cx="26.2" cy="32.2" rx="1.6" ry="1" fill="#FF8A6B" opacity="0.38"/>
  <ellipse cx="37.8" cy="32.2" rx="1.6" ry="1" fill="#FF8A6B" opacity="0.38"/>
  <!-- eyes - large cute -->
  <g>
    <ellipse cx="29.1" cy="29.0" rx="3.1" ry="3.4" fill="white" stroke="#E8A838" stroke-width="0.7"/>
    <ellipse cx="34.9" cy="29.0" rx="3.1" ry="3.4" fill="white" stroke="#E8A838" stroke-width="0.7"/>
    <!-- pupils -->
    <circle cx="29.4" cy="29.6" r="1.75" fill="#3A2A18"/>
    <circle cx="35.2" cy="29.6" r="1.75" fill="#3A2A18"/>
    <!-- eye highlights -->
    <circle cx="28.7" cy="28.4" r="0.85" fill="white"/>
    <circle cx="34.5" cy="28.4" r="0.85" fill="white"/>
    <circle cx="29.9" cy="30.7" r="0.42" fill="white" opacity="0.9"/>
    <circle cx="35.7" cy="30.7" r="0.42" fill="white" opacity="0.9"/>
  </g>
  <!-- tiny smile -->
  <path d="M31.2 32.3 Q 32 33.2 32.8 32.3" fill="none" stroke="#6B3A1F" stroke-width="0.7" stroke-linecap="round" opacity="0.9"/>
  <!-- fangs cute tiny -->
  <g fill="white" stroke="#E8A838" stroke-width="0.45">
    <path d="M30.6 32.8 L 31.1 34.6 L 31.8 32.8 Z" />
    <path d="M32.2 32.8 L 32.9 34.6 L 33.4 32.8 Z" />
  </g>
</g>
<!-- golden top hat -->
<g>
  <!-- brim shadow -->
  <ellipse cx="32" cy="24.2" rx="8.6" ry="1.8" fill="#B07D1A" opacity="0.25"/>
  <!-- crown -->
  <path d="M26.2 24.2 L 26.2 14.8 C 26.2 13.2 27.4 12 29 12 L 35 12 C 36.6 12 37.8 13.2 37.8 14.8 L 37.8 24.2 Z" fill="url(#hatGold)" stroke="#C9982B" stroke-width="1.15"/>
  <!-- top -->
  <ellipse cx="32" cy="12" rx="5.8" ry="1.7" fill="#FFF2B8" stroke="#C9982B" stroke-width="1.15"/>
  <!-- band -->
  <rect x="26.2" y="18.6" width="11.6" height="2.7" rx="0.6" fill="#7A9A3E" stroke="#5A7247" stroke-width="0.6"/>
  <!-- band buckle / button -->
  <circle cx="32" cy="19.95" r="1.25" fill="#FFF8E7" stroke="#C9982B" stroke-width="0.55"/>
  <circle cx="32" cy="19.95" r="0.45" fill="#F5C542"/>
  <!-- brim -->
  <ellipse cx="32" cy="24.2" rx="8.8" ry="2.7" fill="url(#hatGold)" stroke="#C9982B" stroke-width="1.15"/>
  <!-- brim highlight -->
  <ellipse cx="30.5" cy="23.1" rx="3.2" ry="0.7" fill="white" opacity="0.38"/>
  <!-- hat shine -->
  <path d="M28.2 14.5 C 28.2 14.5 28 16.8 28.8 18.2" stroke="white" stroke-width="0.9" stroke-linecap="round" opacity="0.42"/>
</g>
<!-- tiny sparkle for storybook charm -->
<g fill="white" opacity="0.9">
  <path d="M46.5 16.5 l 0.6 1.1 l 1.1 0.6 l -1.1 0.6 l -0.6 1.1 l -0.6 -1.1 l -1.1 -0.6 l 1.1 -0.6 Z"/>
  <path d="M17.2 18.2 l 0.45 0.8 l 0.8 0.45 l -0.8 0.45 l -0.45 0.8 l -0.45 -0.8 l -0.8 -0.45 l 0.8 -0.45 Z" opacity="0.7"/>
</g>
</svg>
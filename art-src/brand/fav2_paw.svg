<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img">
<defs>
  <radialGradient id="furGrad" cx="0.38" cy="0.28" r="0.85">
    <stop offset="0%" stop-color="#FFD9A0"/>
    <stop offset="35%" stop-color="#F7B05C"/>
    <stop offset="65%" stop-color="#F2A65A"/>
    <stop offset="100%" stop-color="#E67E22"/>
  </radialGradient>
  <radialGradient id="padGrad" cx="0.35" cy="0.30" r="0.85">
    <stop offset="0%" stop-color="#FFD6E0"/>
    <stop offset="40%" stop-color="#FF9EB8"/>
    <stop offset="100%" stop-color="#EF6B8E"/>
  </radialGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="2.8" result="b"/>
    <feColorMatrix type="matrix" values="1 0 0 0 0  0 0.82 0 0 0  0 0 0.45 0 0  0 0 0 0.5 0" />
  </filter>
  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
    <feDropShadow dx="0" dy="2.2" stdDeviation="1.6" flood-color="#6B3A12" flood-opacity="0.22"/>
  </filter>
</defs>
<!-- soft warm glow -->
<ellipse cx="32" cy="33.5" rx="25" ry="22.5" fill="#FFC84B" opacity="0.38" filter="url(#glow)"/>
<!-- subtle moss green ambient occlusion - warm cozy -->
<ellipse cx="32" cy="53.8" rx="13.5" ry="3.4" fill="#8FAE6B" opacity="0.22"/>
<!-- organic fluffy fur silhouette -->
<g filter="url(#shadow)">
  <circle cx="20.6" cy="23.2" r="10.4" fill="url(#furGrad)"/>
  <circle cx="32" cy="18.4" r="11.2" fill="url(#furGrad)"/>
  <circle cx="43.4" cy="23.2" r="10.4" fill="url(#furGrad)"/>
  <ellipse cx="32" cy="41.8" rx="20.8" ry="16.8" fill="url(#furGrad)"/>
  <!-- bridge to smooth valleys -->
  <ellipse cx="26.2" cy="28.6" rx="6.5" ry="6" fill="url(#furGrad)"/>
  <ellipse cx="37.8" cy="28.6" rx="6.5" ry="6" fill="url(#furGrad)"/>
</g>
<!-- cream highlight on fur top for storybook softness -->
<path d="M 22.2 15.2 C 24.8 11.8 28.2 10.2 32 10.2 C 35.8 10.2 39.1 11.8 41.7 15.2 C 39.2 13.6 35.8 13 32 13 C 28.2 13 24.7 13.6 22.2 15.2 Z" fill="#FFF6E6" opacity="0.92"/>
<ellipse cx="26.5" cy="36.2" rx="3.2" ry="1.6" fill="#FFF6E6" opacity="0.18"/>
<!-- pink pads -->
<g>
  <!-- toe pads -->
  <ellipse cx="20.6" cy="23.6" rx="5.4" ry="5.6" fill="url(#padGrad)"/>
  <ellipse cx="32" cy="18.9" rx="5.9" ry="6.1" fill="url(#padGrad)"/>
  <ellipse cx="43.4" cy="23.6" rx="5.4" ry="5.6" fill="url(#padGrad)"/>
  <!-- central large pad - classic cat tri-lobe -->
  <path d="M 32 51.8 C 27.1 51.8 18.6 47.9 18.6 40.4 C 18.6 35.1 22.1 31.2 26 32.7 C 27.6 28.7 36.4 28.7 38 32.7 C 41.9 31.2 45.4 35.1 45.4 40.4 C 45.4 47.9 36.9 51.8 32 51.8 Z" fill="url(#padGrad)"/>
</g>
<!-- cream specular highlights on pads for cozy gloss -->
<ellipse cx="18.9" cy="21.6" rx="1.7" ry="1.3" fill="#FFF6E6" opacity="0.98"/>
<ellipse cx="30.0" cy="16.7" rx="1.9" ry="1.4" fill="#FFF6E6" opacity="0.98"/>
<ellipse cx="41.7" cy="21.6" rx="1.7" ry="1.3" fill="#FFF6E6" opacity="0.98"/>
<path d="M 24.4 37.8 C 24.4 35.9 25.8 33.8 27.9 34.6 C 28.9 32.4 31.2 31.4 32.8 33.2 C 34.5 31.4 36.7 32.5 37.6 34.6 C 39.6 33.9 40.8 35.8 40.3 37.8 C 40.3 37.8 37.5 34.9 32 34.9 C 26.5 34.9 24.4 37.8 24.4 37.8 Z" fill="#FFF6E6" opacity="0.92"/>
<ellipse cx="32" cy="42.2" rx="6.2" ry="3.0" fill="#FFF6E6" opacity="0.22"/>
<!-- gold warm rim on bottom of palm for depth -->
<path d="M 21.5 47.2 C 24.2 49.8 28.0 51.2 32 51.2 C 36 51.2 39.8 49.8 42.5 47.2 C 39.2 49.0 35.7 49.6 32 49.6 C 28.3 49.6 24.8 49.0 21.5 47.2 Z" fill="#7A9A4A" opacity="0.18"/>
</svg>
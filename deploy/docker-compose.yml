name: cozy-knight

services:
  vpn:
    image: cozy-knight-sing-box:1.11.15
    build:
      context: ./sing-box
    restart: unless-stopped
    env_file: ../.env
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./sing-box.example.json:/etc/sing-box/config.template.json:ro
    networks:
      backend:
        aliases:
          - acme-proxy
    healthcheck:
      test: ["CMD", "sing-box", "check", "-c", "/tmp/sing-box-config.json"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - account-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      vpn:
        condition: service_healthy
      db:
        condition: service_healthy
    network_mode: service:vpn
    env_file: ../.env
    environment:
      NODE_ENV: production
      KNIGHT_CACHE_DIR: /var/data/knight
      PORT: 10000
      PYTHON: python3
    volumes:
      - knight-cache:/var/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:10000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: ../.env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -euo pipefail
        : "$${DATABASE_URL:?DATABASE_URL is required}"
        keep_days="$${BACKUP_KEEP_DAYS:-14}"
        case "$$keep_days" in
          ''|*[!0-9]*) echo "BACKUP_KEEP_DAYS must be a nonnegative integer" >&2; exit 1 ;;
        esac
        while true; do
          stamp=$$(date -u +%Y%m%dT%H%M%SZ)
          final="/backups/cozy-$$stamp.sql.gz"
          temporary="$$final.tmp"
          rm -f "$$temporary"
          if pg_dump "$$DATABASE_URL" | gzip > "$$temporary"; then
            mv "$$temporary" "$$final"
          else
            rm -f "$$temporary"
            echo "Database backup failed" >&2
          fi
          find /backups -type f -name 'cozy-*.sql.gz' -mtime "+$$keep_days" -delete
          sleep 86400
        done
    volumes:
      - account-backups:/backups
    networks:
      - backend

  acme-proxy:
    image: node:22-bookworm
    restart: unless-stopped
    depends_on:
      vpn:
        condition: service_healthy
    network_mode: service:vpn
    env_file: ../.env
    volumes:
      - ./acme-proxy.js:/opt/acme-proxy.js:ro
      - /usr/local/bin/lego:/opt/lego:ro
      - lego-data:/var/lib/lego
    command: ["node", "/opt/acme-proxy.js"]

  tunnel:
    image: node:22-bookworm
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    network_mode: service:vpn
    env_file: ../.env
    volumes:
      - /usr/local/bin/cloudflared:/opt/cloudflared:ro
    command: ["/opt/cloudflared", "tunnel", "--no-autoupdate", "--protocol", "http2", "run"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      acme-proxy:
        condition: service_started
    env_file: ../.env
    environment:
      HTTP_PROXY: http://acme-proxy:1080
      HTTPS_PROXY: http://acme-proxy:1080
      NO_PROXY: localhost,127.0.0.1,vpn
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - lego-data:/var/lib/lego:ro
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  knight-cache:
  account-data:
  account-backups:
  caddy-data:
  caddy-config:
  lego-data:
